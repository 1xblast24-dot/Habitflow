name: Build mobile apps

on:
  workflow_dispatch:
    inputs:
      build_ios:
        description: 'Also build the (unsigned) iOS app'
        type: boolean
        default: false
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-mobile.yml'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install and generate Android project
        working-directory: mobile
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Apply HabitFlow app icon
        working-directory: mobile
        run: |
          RES=android/app/src/main/res
          SRC=../icons/icon-512.png
          for spec in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read d s f <<< "$spec"
            inner=$((f * 66 / 100))
            convert "$SRC" -resize ${s}x${s} "$RES/mipmap-$d/ic_launcher.png"
            convert "$SRC" -resize ${s}x${s} "$RES/mipmap-$d/ic_launcher_round.png"
            convert "$SRC" -resize ${inner}x${inner} -background none -gravity center -extent ${f}x${f} "$RES/mipmap-$d/ic_launcher_foreground.png"
          done
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="ic_launcher_background">#388FCA</color>\n</resources>\n' > "$RES/values/ic_launcher_background.xml"

      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Copy APK to downloads/
        run: |
          mkdir -p downloads
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk downloads/habitflow.apk

      - uses: actions/upload-artifact@v4
        with:
          name: habitflow-android-apk
          path: downloads/habitflow.apk

      - name: Commit APK so the site download button works
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/habitflow.apk
          git commit -m "chore: update Android APK [skip ci]" || echo "No changes"
          git pull --rebase origin main || true
          git push

  ios:
    if: ${{ inputs.build_ios }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and generate iOS project
        working-directory: mobile
        run: |
          npm install
          npx cap add ios
          npx cap sync ios

      - name: Archive (unsigned)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -archivePath $PWD/build/App.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        working-directory: mobile/ios/App/build
        run: |
          mkdir Payload
          cp -r App.xcarchive/Products/Applications/App.app Payload/
          zip -r habitflow-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: habitflow-ios-unsigned-ipa
          path: mobile/ios/App/build/habitflow-unsigned.ipa
