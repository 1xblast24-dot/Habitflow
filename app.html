<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HabitFlow</title>
<style>
:root{--bg:#f7f7fa;--surf:#fff;--text:#0d0e14;--mute:#6c7080;--line:#ebebf1;--acc:#5b5bf0;--acc2:#14c8a8;--warn:#f5a623;--bad:#ef4565;--rest:#efeff5;--sh:0 1px 2px rgba(20,20,40,.04),0 8px 24px rgba(20,20,40,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#09090e;--surf:#14141c;--text:#f5f5fa;--mute:#8a8ea0;--line:#23232f;--acc:#8c8cff;--rest:#1d1d28;--sh:0 0 0 transparent}}
:root[data-theme="dark"]{--bg:#09090e;--surf:#14141c;--text:#f5f5fa;--mute:#8a8ea0;--line:#23232f;--acc:#8c8cff;--rest:#1d1d28;--sh:0 0 0 transparent}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 "Inter",-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:22px 18px 130px}
h1{font-size:34px;font-weight:800;margin:2px 0;letter-spacing:-1px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);margin:28px 0 12px;font-weight:700}
.mute{color:var(--mute);font-size:14px}.row{display:flex;align-items:center;gap:12px}.sp{flex:1}
.card{background:var(--surf);border-radius:24px;padding:4px 16px;box-shadow:var(--sh);border:1px solid var(--line)}
.item{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);min-height:72px}.item:last-child{border-bottom:0}
.item .sp>div:first-child{font-weight:600}
.ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:22px;flex:none}
.chk{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--surf);color:#fff;font-size:20px;font-weight:700;flex:none;cursor:pointer;transition:transform .15s,background .2s}
.chk:active{transform:scale(.88)}.chk.COMPLETED{background:var(--c);border-color:var(--c);animation:pop .3s}.chk.PARTIAL{border-color:var(--c);color:var(--c)}.chk.SKIPPED{color:var(--mute);border-style:dashed}
@keyframes pop{50%{transform:scale(1.14)}}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:0;border-radius:16px;padding:13px 20px;background:var(--text);color:var(--bg);font-weight:700;min-height:46px}
.btn.g{background:var(--rest);color:var(--text)}.btn.d{background:none;color:var(--bad);border:1px solid var(--line)}
.step{width:40px;height:40px;border-radius:50%;border:0;background:var(--rest);font-size:20px;font-weight:600}
.val{min-width:78px;text-align:center;border:0;background:none;font-weight:700;padding:8px 2px;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:9px;background:var(--rest);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:9px;transition:width .4s}
.dock{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:400px;margin:0 auto;display:flex;padding:6px;border-radius:999px;background:color-mix(in srgb,var(--surf) 72%,transparent);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid color-mix(in srgb,var(--text) 8%,transparent);box-shadow:0 10px 36px rgba(20,20,50,.18);z-index:5}
.dock button{flex:1;border:0;background:none;border-radius:999px;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--mute);gap:3px;transition:background .25s,color .25s}
.dock svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.dock button[aria-current="page"]{background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc)}
.pill{padding:8px 15px;border-radius:99px;border:0;background:var(--rest);font-size:14px;font-weight:600;min-height:38px;white-space:nowrap}.pill.on{background:var(--text);color:var(--bg)}
.seg{display:flex;gap:8px;overflow-x:auto;padding:2px 0}
.sheet{position:fixed;inset:0;background:rgba(5,5,15,.5);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet>div{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:30px 30px 0 0;padding:12px 20px calc(26px + env(safe-area-inset-bottom,0px));animation:up .28s ease-out}
.sheet>div::before{content:"";display:block;width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 16px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
label{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin:16px 0 7px}
input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--surf);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;min-height:46px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
.wd{display:flex;gap:6px}.wd button{flex:1;height:42px;border-radius:50%;border:0;background:var(--rest);font-weight:700}.wd button.on{background:var(--acc);color:#fff}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cd{aspect-ratio:1;border-radius:50%;border:2px solid transparent;background:var(--surf);display:grid;place-items:center;font-size:14px;font-weight:600;position:relative;padding:0}
.cd.sel{border-color:var(--acc)}.cd.t{color:var(--acc);font-weight:800}.cd.u{background:none;color:var(--mute);font-weight:500}
.cd b{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%}
.stat{flex:1;background:var(--surf);border:1px solid var(--line);box-shadow:var(--sh);border-radius:20px;padding:14px 16px}.stat div{font-size:28px;font-weight:800;letter-spacing:-.8px}
.stat.hero{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff;border:0}.stat.hero .mute{color:#ffffffcc}
.bars{display:flex;align-items:flex-end;gap:8px;height:96px}.bars i{flex:1;background:linear-gradient(var(--acc),var(--acc2));border-radius:8px;min-height:4px}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);background:var(--bad);color:#fff;padding:11px 18px;border-radius:99px;z-index:20;font-size:14px;font-weight:600;box-shadow:var(--sh)}
.empty{text-align:center;padding:44px 12px;color:var(--mute)}
.hero{display:flex;align-items:center;gap:18px;margin:14px 0 8px}
.ring{width:96px;height:96px;flex:none;position:relative}.ring svg{transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:800}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--rest);padding:6px 12px;border-radius:99px;font-size:13px;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:7px}
button{transition:transform .15s cubic-bezier(.3,.9,.3,1),background .25s,color .25s}button:active{transform:scale(.95)}
.chk{position:relative;display:grid;place-items:center}.chk.COMPLETED{animation:none}
.chk.fresh.COMPLETED{animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
.chk.COMPLETED svg path{stroke-dasharray:26}.chk.fresh.COMPLETED svg path{animation:draw .4s .08s both}
.chk.fresh.COMPLETED::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--c);animation:burst .6s ease-out forwards}
@keyframes draw{from{stroke-dashoffset:26}to{stroke-dashoffset:0}}@keyframes burst{from{opacity:.7}to{transform:scale(1.7);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.enter>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}.enter>*:nth-child(2){animation-delay:.04s}.enter>*:nth-child(3){animation-delay:.08s}.enter>*:nth-child(4){animation-delay:.12s}.enter>*:nth-child(5){animation-delay:.16s}.enter>*:nth-child(n+6){animation-delay:.2s}
.enter .bars i{transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.9,.3,1) both}@keyframes grow{from{transform:scaleY(0)}}
.enter .bars i:nth-child(2){animation-delay:.04s}.enter .bars i:nth-child(3){animation-delay:.08s}.enter .bars i:nth-child(4){animation-delay:.12s}.enter .bars i:nth-child(5){animation-delay:.16s}.enter .bars i:nth-child(6){animation-delay:.2s}.enter .bars i:nth-child(7){animation-delay:.24s}.enter .bars i:nth-child(8){animation-delay:.28s}
.dock{box-shadow:0 22px 44px -10px rgba(25,25,80,.38),0 6px 14px rgba(25,25,60,.14),inset 0 1px 0 rgba(255,255,255,.45);border:1px solid color-mix(in srgb,var(--text) 7%,transparent)}
.dock button[aria-current="page"]{background:none}.dock button{position:relative;z-index:1}.dock button span{display:flex}
.dock .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:999px;background:color-mix(in srgb,var(--acc) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 20%,transparent);transform:translateX(calc(var(--i,0)*100%));transition:transform .5s cubic-bezier(.34,1.4,.5,1)}
.dockfade{position:fixed;left:0;right:0;bottom:0;height:calc(120px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:4;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);-webkit-mask-image:linear-gradient(transparent,#000 65%);mask-image:linear-gradient(transparent,#000 65%);background:linear-gradient(transparent,color-mix(in srgb,var(--bg) 80%,transparent))}
.calcard{background:var(--surf);border-radius:30px;padding:20px 14px 18px;margin-top:16px;border:1px solid var(--line);box-shadow:0 28px 60px -22px rgba(40,40,120,.35),0 4px 10px rgba(20,20,50,.05)}
.nav{width:40px;height:40px;border-radius:50%;border:0;background:var(--surf);display:grid;place-items:center;box-shadow:0 6px 16px -2px rgba(25,25,70,.22),0 0 0 1px var(--line)}
.wk{color:var(--mute);font-size:11px;font-weight:700;letter-spacing:.08em;margin-bottom:10px}.days{row-gap:10px}
.cd{width:100%;max-width:44px;margin:auto;border:0;background:conic-gradient(var(--acc2) calc(var(--p)*1%),var(--rest) 0);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;position:relative;padding:0;font-weight:600}
.cd::before{content:"";position:absolute;inset:3.5px;border-radius:50%;background:var(--surf)}.cd span{position:relative}
.cd.u{background:none;color:var(--mute);font-weight:500}.cd.u::before{display:none}
.cd.t span{color:var(--acc);font-weight:800}
.cd.sel{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff;transform:scale(1.08);box-shadow:0 10px 20px -4px color-mix(in srgb,var(--acc) 65%,transparent)}.cd.sel::before{display:none}.cd.sel span{color:#fff}
.cd2{aspect-ratio:1;border:0;border-radius:12px;font-weight:600;font-size:13px;padding:0;min-height:36px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== Translucent scroll nav (IG-style) ===== */
.dock{transition:transform .45s cubic-bezier(.2,.8,.2,1),background .35s,box-shadow .35s,opacity .35s;will-change:transform}
.dock.scrolling{background:color-mix(in srgb,var(--surf) 38%,transparent);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);box-shadow:0 12px 30px -12px rgba(25,25,80,.22),inset 0 1px 0 rgba(255,255,255,.3)}
.dock.hide{transform:translateY(calc(100% + 28px));opacity:.0}
.dock button svg{transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.dock button[aria-current="page"] svg{transform:translateY(-1px) scale(1.12)}
.dock button.bump svg{animation:bump .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes bump{40%{transform:translateY(-4px) scale(1.25)}}
.dockfade{transition:opacity .35s}.dockfade.hide{opacity:0}

/* ===== iOS-style sheet + settings ===== */
.ios-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:-2px 0 14px}
.ios-top b{font-size:17px;font-weight:700}.ios-top button{border:0;background:none;font-size:17px;color:var(--acc);padding:8px 0;min-height:40px}
.ios-top button:last-child{text-align:right;font-weight:700}.ios-top button:first-child{text-align:left}
.ios-prev{display:grid;place-items:center;margin:4px 0 16px}.ios-prev .ic{width:76px;height:76px;border-radius:24px;font-size:34px;transition:background .3s,color .3s}
.gl{font-size:13px;color:var(--mute);margin:20px 16px 7px;text-transform:uppercase;letter-spacing:.04em;font-weight:500}
.gf{font-size:13px;color:var(--mute);margin:7px 16px 0;line-height:1.35}
.grp{background:var(--surf);border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.rw{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;position:relative}
.rw+.rw::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.rw>span:first-child{flex:none}.rw input,.rw select{border:0;background:none;min-height:50px;padding:0;border-radius:0;text-align:right;flex:1;box-shadow:none!important}
.rw input.l{text-align:left}.rw input[type=time],.rw input[type=date]{flex:none;width:auto;color:var(--acc);font-weight:600}
.rw .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:15px;flex:none}
.sg{display:flex;background:var(--rest);border-radius:11px;padding:3px;margin:10px 12px}
.sg button{flex:1;border:0;background:none;border-radius:9px;min-height:34px;font-size:14px;font-weight:600;color:var(--text);transition:background .25s,box-shadow .25s}
.sg button.on{background:var(--surf);box-shadow:0 2px 8px rgba(0,0,0,.14)}
.sw{width:51px;height:31px;border-radius:99px;border:0;background:color-mix(in srgb,var(--mute) 35%,transparent);position:relative;flex:none;transition:background .3s;padding:0;margin-left:auto}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.25);transition:transform .35s cubic-bezier(.34,1.4,.5,1)}
.sw.on{background:#34c759}.sw.on::after{transform:translateX(20px)}.sw:active::after{width:33px}.sw.on:active::after{transform:translateX(14px)}
.pk{padding:12px 14px 14px;display:flex;gap:10px;flex-wrap:wrap}.pk .pill{width:44px;height:44px;padding:0;justify-content:center;border-radius:14px}
.pk .step{width:34px;height:34px;border:3px solid transparent;box-shadow:inset 0 0 0 2px var(--surf)}
.tgr{display:none}.tgr.show{display:flex}
.rem{overflow:hidden;max-height:0;transition:max-height .4s cubic-bezier(.2,.8,.2,1)}.rem.show{max-height:70px}
.nt{display:flex;gap:11px;align-items:center;margin:12px;padding:11px 13px;border-radius:18px;background:color-mix(in srgb,var(--surf) 60%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--line);box-shadow:var(--sh)}
.nt .ap{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--acc2),var(--acc));display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.nt small{color:var(--mute);font-size:12px}.nt div div{font-size:14px;font-weight:600;line-height:1.25}

/* ===== Plan & Goals + 6-tab dock + Telegram-style motion ===== */
.dock{max-width:440px;touch-action:none;user-select:none;-webkit-user-select:none}
.dock .ind{width:calc((100% - 12px)/6);transition:transform .55s cubic-bezier(.3,1.35,.45,1),scale .3s,background .3s}
.dock .ind.move{animation:stretch .6s cubic-bezier(.3,1.3,.5,1)}
@keyframes stretch{30%{scale:1.5 .88}65%{scale:.96 1.04}}
.dock.hold .ind{scale:1.1 1.06;background:color-mix(in srgb,var(--acc) 26%,transparent)}
.dock.hold button[aria-current="page"] svg{transform:scale(.92)}
.dock button{font-size:9.5px}
@keyframes sr{from{opacity:0;transform:translateX(30px)}}@keyframes sl{from{opacity:0;transform:translateX(-30px)}}
.enter.dr>*{animation-name:sr}.enter.dl>*{animation-name:sl}
.wk7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0 4px}
.dy{border:0;border-radius:18px;background:var(--surf);border:1px solid var(--line);min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;transition:background .3s,color .3s,transform .3s cubic-bezier(.34,1.56,.64,1)}
.dy small{font-size:11px;font-weight:700;color:var(--mute);letter-spacing:.04em}.dy b{font-size:18px;font-weight:700}
.dy i{width:5px;height:5px;border-radius:50%;background:transparent}.dy i.p{background:var(--warn)}.dy i.f{background:var(--acc2)}
.dy.sel{background:var(--acc);border-color:var(--acc);color:#fff;transform:translateY(-2px);box-shadow:0 12px 22px -10px var(--acc)}.dy.sel small{color:#ffffffcc}.dy.sel i.f,.dy.sel i.p{background:#fff}
.dy.t:not(.sel) b{color:var(--acc)}
.pr{padding:9px 16px;min-height:62px}.tm{width:62px;font-size:13px;font-weight:600;color:var(--mute);font-variant-numeric:tabular-nums}
.pr .ic{width:38px;height:38px;border-radius:12px}.ok{width:26px;height:26px;border-radius:50%;background:var(--acc2);color:#fff;display:grid;place-items:center;flex:none}
.gh{padding:14px 16px}.gh .bar{margin-top:10px}
.goal{padding:16px;display:flex;gap:14px;align-items:center;cursor:pointer}.goal+.goal{margin-top:12px}
.goal .gr{width:56px;height:56px;position:relative;flex:none}.goal .gr svg{transform:rotate(-90deg)}.goal .gr span{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:800}
.goal .t{font-weight:700;font-size:16px}.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--acc2);margin-top:3px}
.mini{display:flex;gap:6px}.mini button{width:34px;height:34px;border-radius:50%;border:0;background:var(--rest);font-size:18px;font-weight:600;padding:0}
.plus{width:38px;height:38px;border-radius:50%;border:0;background:var(--acc);color:#fff;display:grid;place-items:center;padding:0;box-shadow:0 8px 18px -6px var(--acc)}
.dgd{border:0;background:none;color:var(--bad);font-size:17px;width:100%;min-height:52px}

/* ===== Routines + smooth drag ===== */
.dock.drag .ind{transition:none}
.rc{margin-top:12px}.rh{min-height:66px;gap:13px}.rh .t{font-weight:700;font-size:16px}
.rc .rw.st{min-height:48px}.rc .chk{width:28px;height:28px;border-width:2px;font-size:0}.rc .chk svg{width:15px;height:15px}
.rc .st .sp{transition:color .3s}.rc .st.dn .sp{color:var(--mute);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--mute) 60%,transparent)}
.rc .chk:disabled{opacity:.35;cursor:default}
.wg{display:grid;grid-template-columns:minmax(0,1fr) repeat(7,30px);gap:5px;align-items:center;padding:10px 12px;position:relative}
.wg+.wg::before{content:"";position:absolute;top:0;left:12px;right:0;height:1px;background:var(--line)}
.wg small{text-align:center;font-size:11px;font-weight:700;color:var(--mute)}.wg small.t{color:var(--acc)}
.wc{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:none;padding:0;display:grid;place-items:center;color:#fff;transition:background .25s,border-color .25s,transform .3s cubic-bezier(.34,1.56,.64,1)}
.wc.on{background:var(--c);border-color:var(--c)}.wc svg{width:14px;height:14px;opacity:0;transition:opacity .2s}.wc.on svg{opacity:1}
.mx{width:26px;height:26px;border-radius:50%;border:0;background:var(--bad);color:#fff;padding:0;font-size:16px;line-height:1;flex:none}
.addrow{color:var(--acc);font-weight:600;border:0;background:none;width:100%;min-height:50px;text-align:left;padding:0 16px;font-size:16px}
.tp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.tp .stat{padding:12px 14px}.tp .stat div{font-size:24px}


/* ===== Area grids ===== */
.agw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.ag{display:grid;grid-template-columns:84px repeat(7,minmax(70px,1fr));min-width:min-content}
.ag>div{padding:6px 4px;border-top:1px solid var(--line);min-width:0}
.ag .h{border-top:0;text-align:center;font-size:11px;font-weight:700;color:var(--mute)}.ag .h b{display:block;font-size:15px;color:var(--text)}.ag .h.t b{color:var(--acc)}
.ag .rl{position:sticky;left:0;background:var(--surf);z-index:1;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;padding-left:10px}

var ready=false,busy=false,again=false,timer=null,shown=false;
var root=document.documentElement;root.style.visibility='hidden';
function reveal(){if(!shown){shown=true;root.style.visibility=''}}
setTimeout(reveal,4500);

/* A different account used this device before: don't mix their habits into this account */
var m0=rd(META);
if(m0&&m0.user&&m0.user!==S.id){DK.forEach(function(k){ls.removeItem(k)});ls.removeItem(META)}
function meta(p){var m=rd(META)||{};for(var k in p)m[k]=p[k];put(META,m);return m}

async function token(){
  if(S.rt&&S.exp&&S.exp-60000<Date.now()){
    var r=await fetch(URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify({refresh_token:S.rt})});
    if(r.status===400||r.status===401)throw'auth';
    if(!r.ok)throw'net';
    var j=await r.json();S.token=j.access_token;S.rt=j.refresh_token||S.rt;S.exp=Date.now()+(j.expires_in||3600)*1000;put(SK,S);
  }
  return S.token;
}
function expired(){try{ls.removeItem(SK)}catch(e){}location.replace('login.html')}
function payload(){return{user_id:S.id,planner:rd(DK[0])||{},areas:rd(DK[1])||{}}}

async function push(){
  if(!ready)return;
  if(busy){again=true;return}
  busy=true;
  try{
    var t=await token();
    var r=await fetch(URL+'/rest/v1/user_data?on_conflict=user_id',{method:'POST',keepalive:true,headers:{apikey:KEY,Authorization:'Bearer '+t,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify(payload())});
    if(r.status===401)throw'auth';
    if(!r.ok)throw'net';
    var j=await r.json();
    meta({user:S.id,at:j[0]&&j[0].updated_at,dirty:again});
  }catch(e){
    if(e==='auth'){expired();return}
    meta({dirty:true});setTimeout(push,20000);
  }finally{busy=false;if(again){again=false;schedule()}}
}
function schedule(){clearTimeout(timer);timer=setTimeout(push,1200)}

Storage.prototype.setItem=function(k){
  rawSet.apply(this,arguments);
  if(this===ls&&DK.indexOf(k)>-1){meta({dirty:true});if(ready)schedule()}
};
addEventListener('visibilitychange',function(){if(document.hidden&&ready&&(rd(META)||{}).dirty)push()});
addEventListener('pagehide',function(){if(ready&&(rd(META)||{}).dirty)push()});

function hasData(o){return o&&typeof o==='object'&&Object.keys(o).length>0}
async function pull(){
  var t=await token(),c=new AbortController(),to=setTimeout(function(){c.abort()},4000);
  try{
    var r=await fetch(URL+'/rest/v1/user_data?user_id=eq.'+encodeURIComponent(S.id)+'&select=planner,areas,updated_at',{headers:{apikey:KEY,Authorization:'Bearer '+t},signal:c.signal});
    if(r.status===401)throw'auth';
    if(!r.ok)throw'net';
    var a=await r.json();return a[0]||null;
  }finally{clearTimeout(to)}
}
async function sync(){
  var r;
  try{r=await pull()}
  catch(e){if(e==='auth'){expired();return}reveal();setTimeout(sync,20000);return}
  var m=rd(META)||{},linked=m.user===S.id;
  if(r){
    var newer=!m.at||Date.parse(r.updated_at)>Date.parse(m.at);
    if(!linked||(newer&&!m.dirty)){
      if(!linked&&(ls.getItem(DK[0])||ls.getItem(DK[1])))put('habitflow.backup',{planner:ls.getItem(DK[0]),areas:ls.getItem(DK[1])});
      hasData(r.planner)?put(DK[0],r.planner):ls.removeItem(DK[0]);
      hasData(r.areas)?put(DK[1],r.areas):ls.removeItem(DK[1]);
      meta({user:S.id,at:r.updated_at,dirty:false});
      var flag=false;try{flag=sessionStorage.getItem('hf.reload')}catch(e){}
      if(!flag){try{sessionStorage.setItem('hf.reload','1')}catch(e){}location.reload();return}
    }
  }
  try{sessionStorage.removeItem('hf.reload')}catch(e){}
  if(!r)meta({user:S.id,dirty:true});
  ready=true;reveal();
  if((rd(META)||{}).dirty)schedule();
}
sync();
})();

<script>
/* ===== lib/engine: all calculation lives here, UI never computes ===== */
const Engine=(()=>{
 const pad=n=>String(n).padStart(2,'0');
 const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
 const parse=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
 const addDays=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return key(d)};
 const scheduled=(h,k)=>h.days.includes(parse(k).getDay());
 // Day state: single source of truth for every screen
 function state(h,k,today,logs){
  if(k<h.start)return'BEFORE_START';
  if(h.status!=='active')return'PAUSED';
  if(!scheduled(h,k))return'UNSCHEDULED';
  const l=(logs[h.id]||{})[k];
  if(l&&l.skip)return'SKIPPED';
  const v=l?l.v:0, goal=h.type==='yesno'?1:h.target;
  if(v>=goal)return'COMPLETED'; if(v>0)return'PARTIAL';
  return k<today?'MISSED':'PENDING';
 }
 // Streak counts scheduled days only. Completed +1, partial/skipped/pending neutral, missed breaks.
 function streaks(h,today,logs){
  let cur=0,best=0,run=0,k=h.start,curOpen=true;
  const seq=[];for(;k<=today;k=addDays(k,1)){const s=state(h,k,today,logs);if(s==='COMPLETED'||s==='MISSED')seq.push(s)}
  for(const s of seq){if(s==='COMPLETED'){run++;best=Math.max(best,run)}else run=0}
  for(let i=seq.length-1;i>=0&&seq[i]==='COMPLETED';i--)cur++;
  return{cur,best};
 }
 function summary(habits,from,to,today,logs){
  const c={COMPLETED:0,PARTIAL:0,SKIPPED:0,MISSED:0};
  for(const h of habits)for(let k=from;k<=to&&k<=today;k=addDays(k,1)){const s=state(h,k,today,logs);if(s in c)c[s]++}
  const den=c.COMPLETED+c.PARTIAL+c.MISSED;
  return{...c,rate:den?Math.round((c.COMPLETED+c.PARTIAL*.5)/den*100):null};
 }
 function dayProgress(habits,k,today,logs){
  const act=habits.filter(h=>h.status==='active'),r={done:0,total:0,items:[]};
  for(const h of act){const s=state(h,k,today,logs);if(['UNSCHEDULED','BEFORE_START'].includes(s))continue;r.total++;if(s==='COMPLETED')r.done++;r.items.push({h,s,v:((logs[h.id]||{})[k]||{}).v||0})}
  return r;
 }
 return{key,parse,addDays,state,streaks,summary,dayProgress,scheduled};
})();

/* ===== services/storage: per-browser persistence with surfaced errors ===== */
let SESS={};try{SESS=JSON.parse(localStorage.getItem('habitflow.session'))||{}}catch(e){}
const Store={
 load(){try{return JSON.parse(localStorage.getItem('habitflow')||'null')}catch(e){return null}},
 save(d){try{localStorage.setItem('habitflow',JSON.stringify(d));return true}catch(e){toast('Could not save: storage unavailable. Changes will be lost on reload.');return false}}
};
let D=Store.load()||{habits:[],logs:{},settings:{theme:'auto',quiet:['22:00','07:00'],goal:80,notify:false},onboarded:false,goals:[]};
D.goals=D.goals||[];D.routines=D.routines||[];D.rlogs=D.rlogs||{};
const todayK=()=>Engine.key(new Date());
const commit=()=>{Store.save(D);render()};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3500)}

/* ===== actions (serialized state updates; each is synchronous so rapid taps can't interleave) ===== */
function setLog(hid,k,patch){V.fresh=hid+k;
 const h=D.habits.find(x=>x.id===hid);const L=(D.logs[hid]=D.logs[hid]||{});
 if(patch===null){delete L[k]}else{
  const cur=L[k]||{v:0,skip:false,note:''};const n={...cur,...patch};
  if(n.v!=null)n.v=Math.max(0,Math.min(n.v,h.type==='yesno'?1:h.target*10));
  L[k]=n}
 commit();
}
const step=h=>h.type==='duration'?5:Math.max(1,Math.round(h.target/10));
const uid=()=>Math.random().toString(36).slice(2,10);

/* ===== UI ===== */
let V={tab:'today',range:7,month:todayK().slice(0,7),sel:todayK(),habit:null,showArch:false};
const TABS=[['today','<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg>','Today'],['plan','<svg viewBox="0 0 24 24"><path d="M5 21V4M5 4h11.5l-2.3 4 2.3 4H5"/></svg>','Plan'],['habits','<svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>','Habits'],['insights','<svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>','Insights'],['calendar','<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>','Calendar'],['profile','<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c1-4 4-5.5 7.5-5.5s6.5 1.5 7.5 5.5"/></svg>','Profile']];
const COLORS=['#5b5bf0','#14c8a8','#ff7a45','#ff4d8d','#f5a623','#2ea0ff'];
const ICONS=['book','dumbbell','drop','moon','leaf','pen','heart','target','apple','bolt'];
const svg=(p,c='',w=2.6,z=22)=>`<svg class="${c}" width="${z}" height="${z}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC={book:'<path d="M4 19.5V5a2 2 0 012-2h14v15H6a2 2 0 00-2 2zm0 0a2 2 0 002 2h14"/>',dumbbell:'<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>',drop:'<path d="M12 3s6 6.2 6 10.5a6 6 0 01-12 0C6 9.2 12 3 12 3z"/>',moon:'<path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/>',leaf:'<path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15M5 19l7-7"/>',pen:'<path d="M4 20l1-4L16.5 4.5a2 2 0 013 3L8 19z"/>',heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 017-2.5A4 4 0 0119 10c0 5.6-7 10-7 10z"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/>',apple:'<path d="M12 7c-3-2-7 0-7 5 0 4 3 8 5 8 1 0 1.5-.5 2-.5s1 .5 2 .5c2 0 5-4 5-8 0-5-4-7-7-5zM12 7c0-2 1-3 3-4"/>',bell:'<path d="M6 16V11a6 6 0 0112 0v5l1.5 2h-15zM10 21h4"/>',bolt:'<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>',flame:'<path d="M12 3c1 3 5 5 5 10a5 5 0 01-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-9z"/>'};
const ico=(k,z=22)=>svg(IC[k]||IC.target,'',1.9,z);
const SYM={COMPLETED:svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),PARTIAL:svg('<path d="M7 12h10"/>'),SKIPPED:svg('<path d="M5 12h14M13 6l6 6-6 6"/>',''),MISSED:'',PENDING:''};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate=k=>Engine.parse(k).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
const unit=h=>h.type==='yesno'?'':(h.unit||(h.type==='duration'?'min':''));

function applyTheme(){const t=D.settings.theme;if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t)}

function dock(){return`<nav class="dock" aria-label="Main">${TABS.map(([id,i,l])=>`<button ${V.tab===id?'aria-current="page"':''} data-act="tab" data-id="${id}" aria-label="${l}"><span>${i}</span>${l}</button>`).join('')}</nav>`}

function habitRow(h,k,today,withControls){
 const s=Engine.state(h,k,today,D.logs),v=((D.logs[h.id]||{})[k]||{}).v||0,c=`style="--c:${h.color}"`;
 let ctl;
 if(h.type==='yesno')ctl=`<button class="chk ${s}${V.fresh===h.id+k?' fresh':''}" ${c} data-act="toggle" data-h="${h.id}" data-k="${k}" aria-label="${s==='COMPLETED'?'Mark not done':'Complete'} ${esc(h.name)}">${SYM[s]}</button>`;
 else ctl=`<button class="step" data-act="dec" data-h="${h.id}" data-k="${k}" aria-label="Decrease">−</button><button class="val" data-act="log" data-h="${h.id}" data-k="${k}" aria-label="Enter exact value">${v} / ${h.target}${unit(h)?' '+esc(unit(h)):''}</button><button class="step" data-act="inc" data-h="${h.id}" data-k="${k}" aria-label="Increase">+</button>`;
 return`<div class="item"><div class="ic" style="background:${h.color}1f;color:${h.color}">${ico(h.icon)}</div><div class="sp" data-act="log" data-h="${h.id}" data-k="${k}" style="cursor:pointer"><div>${esc(h.name)}</div><div class="mute">${s==='SKIPPED'?'Skipped':s==='PARTIAL'?'Partial':s==='MISSED'?'Not logged':s==='COMPLETED'?'Done':'To do'}</div></div>${ctl}</div>`;
}

function vToday(){
 const t=todayK(),p=Engine.dayProgress(D.habits,t,t,D.logs),X=window.xgCount?window.xgCount():{n:0,d:0},pct=(p.total+X.n)?Math.round((p.done+X.d)/(p.total+X.n)*100):0;
 const best=Math.max(0,...D.habits.filter(h=>h.status==='active').map(h=>Engine.streaks(h,t,D.logs).cur));
 const hr=new Date().getHours(),gr=hr<12?'Good morning':hr<18?'Good afternoon':'Good evening';
 const msg=!(p.total+X.n)?'Nothing scheduled today. Rest is part of the plan.':p.done+X.d===p.total+X.n?'Everything done. That is consistency.':p.done+X.d?'Nice momentum. Keep it going.':'Start with the easiest one.';
 const C=2*Math.PI*42,from=V.ringPct||0;V.ringPct=pct;
 return`<div class="mute" style="font-weight:600">${fmtDate(t)}</div><h1>${gr}</h1>
 <div class="hero"><div class="ring"><svg width="96" height="96" viewBox="0 0 96 96"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14c8a8"/><stop offset="1" stop-color="#5b5bf0"/></linearGradient></defs><circle cx="48" cy="48" r="42" fill="none" stroke="var(--rest)" stroke-width="9"/><circle cx="48" cy="48" r="42" fill="none" stroke="url(#rg)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-from/100)}" data-off="${C*(1-pct/100)}" style="transition:stroke-dashoffset .8s cubic-bezier(.3,.9,.3,1)"/></svg><b>${pct}%</b></div>
 <div class="sp"><div style="font-size:20px;font-weight:800">${p.done+X.d} of ${p.total+X.n} done</div><div class="mute" style="margin:2px 0 8px">${msg}</div>${best?`<span class="chip"><i style="color:var(--warn);display:inline-flex">${svg(IC.flame,'',2,16)}</i> ${best} day streak</span>`:''}</div></div>
 <h2>Today's habits</h2>
 ${p.items.length||X.n?`<div class="card">${window.xgMerge?window.xgMerge(p.items.map(i=>({k:i.h.reminder||'99:99',html:habitRow(i.h,t,t,1)}))):p.items.map(i=>habitRow(i.h,t,t,1)).join('')}</div>`:D.habits.some(h=>h.status==='active')?'<div class="empty">No habits scheduled today.</div>':`<div class="empty">Add your first habit to begin.<br><br><button class="btn" data-act="new">Create habit</button></div>`}`;
}

function vHabits(){
 const t=todayK(),list=D.habits.filter(h=>V.showArch?h.status==='archived':h.status!=='archived');
 const sched=h=>h.days.length===7?'Every day':h.days.map(d=>'SMTWTFS'[d]).join(' ');
 return`<div class="row"><h1 class="sp">Habits</h1><button class="btn" data-act="new">+ New</button></div>${window.xgWeek?window.xgWeek():''}
 <div class="seg" style="margin:10px 0"><button class="pill ${!V.showArch?'on':''}" data-act="arch" data-v="0">Active</button><button class="pill ${V.showArch?'on':''}" data-act="arch" data-v="1">Archived</button></div>
 ${list.length?`<div class="card">${list.map(h=>{const st=Engine.streaks(h,t,D.logs),sm=Engine.summary([h],h.start,t,t,D.logs);
 return`<div class="item" data-act="detail" data-h="${h.id}" style="cursor:pointer"><div class="ic" style="background:${h.color}1f;color:${h.color}">${ico(h.icon)}</div><div class="sp"><div>${esc(h.name)}${h.status==='paused'?' <span class="mute">· paused</span>':''}</div><div class="mute">${sched(h)}${h.type!=='yesno'?` · ${h.target} ${esc(unit(h))}`:''}${h.reminder?` · ${h.reminder}`:''}</div></div><div style="text-align:right"><b>${st.cur}</b><div class="mute" style="font-size:12px">best ${st.best} · ${sm.rate==null?'—':sm.rate+'%'}</div></div></div>`}).join('')}</div>`:`<div class="empty">${V.showArch?'No archived habits.':'No habits yet.'}</div>`}`;
}


const gProg=g=>{const t=todayK(),h=g.habit&&D.habits.find(x=>x.id===g.habit);if(!h)return g.done||0;let n=0;for(let k=g.start;k<=t;k=Engine.addDays(k,1))if(Engine.state(h,k,t,D.logs)==='COMPLETED')n++;return n};
const slot=h=>!h.reminder?3:h.reminder<'12:00'?0:h.reminder<'17:00'?1:2;

const seg=t=>`<div class="sg" style="margin:12px 0 0">${[['plan','Plan'],['week','Week'],['areas','Areas'],['goals','Goals']].map(([i,l])=>`<button class="${t===i?'on':''}" data-act="ptab" data-v="${i}">${l}</button>`).join('')}</div>`;
const CK='<path d="M5 12.5l4.5 4.5L19 7.5"/>';
const rDone=(r,k)=>((D.rlogs[r.id]||{})[k]||[]).filter(i=>r.steps.some(s=>s.id===i)).length;
const rOn=(r,k)=>r.status!=='archived'&&k>=r.start&&r.days.includes(Engine.parse(k).getDay());
const rFull=(r,k)=>r.steps.length>0&&rDone(r,k)>=r.steps.length;
function rStreak(r,t){let c=0,k=t;for(let i=0;i<400&&k>=r.start;i++,k=Engine.addDays(k,-1)){if(!r.days.includes(Engine.parse(k).getDay()))continue;if(rFull(r,k))c++;else if(k!==t)break}return c}
const ringSm=(p,c)=>{const C=2*Math.PI*14;return`<svg width="38" height="38" viewBox="0 0 38 38" style="transform:rotate(-90deg);flex:none"><circle cx="19" cy="19" r="14" fill="none" stroke="var(--rest)" stroke-width="4.5"/><circle cx="19" cy="19" r="14" fill="none" stroke="${c}" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" style="transition:stroke-dashoffset .5s cubic-bezier(.3,.9,.3,1)"/></svg>`};
const PLUS='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
const TPL=[['Morning routine','leaf','07:00',[0,1,2,3,4,5,6],['Drink water','Stretch 5 min','Plan the day']],['Workout','dumbbell','17:30',[1,3,5],['Warm up','Main sets','Cool down']],['Evening wind-down','moon','21:30',[0,1,2,3,4,5,6],['Journal','Prepare tomorrow','Screens off']]];
function vPlan(){
 const t=todayK(),tab=V.ptab||'plan';if(tab==='goals')return vGoals();if(tab==='areas')return V.area?vArea(V.area):vAreas();
 const R=D.routines.filter(r=>r.status!=='archived'),dow=Engine.parse(t).getDay(),ws=Engine.addDays(t,-dow);
 const head=`<div class="row"><div class="sp"><div class="mute" style="font-weight:600">${tab==='plan'?'Your routine system':'Weekly template'}</div><h1>${tab==='plan'?'Plan':'Week'}</h1></div><button class="plus" data-act="rnew" aria-label="New routine">${PLUS}</button></div>${seg(tab)}`;
 if(!R.length)return head+`<div class="empty" style="padding-top:56px"><div style="color:var(--acc);display:grid;place-items:center;margin-bottom:12px">${svg('<path d="M5 21V4M5 4h11.5l-2.3 4 2.3 4H5"/>','',1.6,54)}</div><div style="font-weight:700;color:var(--text);font-size:18px">Build your weekly routine</div><div style="margin:6px 0 20px">Routines repeat on the days you choose, with steps you check off.</div><div class="row" style="justify-content:center;flex-wrap:wrap"><button class="btn" data-act="rnew">New routine</button><button class="btn g" data-act="rtpl">Use starter set</button></div></div>`;
 if(tab==='week'){
  const sessions=R.reduce((n,r)=>n+r.days.length,0),steps=R.reduce((n,r)=>n+r.days.length*r.steps.length,0);

/* reminders: browser notifications, only while this tab is open */
async function toggleNotify(){
 if(!('Notification' in window)){toast('This browser does not support notifications');return}
 if(D.settings.notify){D.settings.notify=false;return commit()}
 const p=await Notification.requestPermission();
 if(p!=='granted'){toast('Notification permission was not granted');return}
 D.settings.notify=true;commit();
}
const fired=new Set();
setInterval(()=>{
 if(!D.settings.notify||Notification.permission!=='granted')return;
 const n=new Date(),hm=`${pad2(n.getHours())}:${pad2(n.getMinutes())}`,t=todayK(),[q0,q1]=D.settings.quiet;
 const quiet=q0>q1?(hm>=q0||hm<q1):(hm>=q0&&hm<q1);if(quiet)return;
 for(const h of D.habits){if(h.reminder!==hm||fired.has(h.id+t+hm))continue;
  if(Engine.state(h,t,t,D.logs)==='PENDING'){fired.add(h.id+t+hm);new Notification('HabitFlow',{body:`${h.name} — whenever you're ready.`})}}
for(const r of D.routines||[]){if(!r.remind||r.time!==hm||r.status==='archived'||!r.days.includes(n.getDay())||fired.has(r.id+t+hm))continue;
  if(rDone(r,t)<r.steps.length){fired.add(r.id+t+hm);new Notification('HabitFlow',{body:`${r.name} — time to start.`})}}
},20000);

/* ===== Life areas: Study, Gym, Meals, Recipes, Cooking. One scheduler feeds Home, Calendar and Insights ===== */
const IT=()=>D.items||(D.items=[]),AL=()=>D.al||(D.al={});
const AR={study:{n:'Study',i:'book',c:'#5b5bf0'},gym:{n:'Gym',i:'dumbbell',c:'#ff7a45'},meals:{n:'Meals',i:'apple',c:'#14c8a8'},recipes:{n:'Recipes',i:'leaf',c:'#f5a623'},cook:{n:'Cooking',i:'flame',c:'#ff4d8d'}};
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],DNF=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],CKS=['Ingredients','Preparation','Steps','Timing','Done'];
const lines=s=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);
const arOf=i=>i.area==='recipes'?'cook':i.area;
const areaItems=a=>IT().filter(i=>a==='cook'?i.area==='recipes':i.area===a);
const tmin=s=>{const[a,b]=s.split(':').map(Number);return a*60+b};
const nowM=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const hm=m=>`${pad2(Math.floor(m/60)%24)}:${pad2(m%60)}`;
const sd=k=>Engine.parse(k).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
const lg=(i,k)=>(AL()[i.id]||{})[k]||{};
const sOn=(i,k)=>!!(i.sch&&i.sch.days.length&&k>=i.start&&i.sch.days.includes(Engine.parse(k).getDay()));
/* lifecycle: planned (no schedule) -> scheduled -> due -> completed / skipped / missed */
function lc(i,k){
 if(!i.sch||!i.sch.days.length)return'planned';
 const l=lg(i,k);if(l.s==='done')return'completed';if(l.s==='skip')return'skipped';
 const t=todayK();if(k>t)return'scheduled';if(k<t)return'missed';
 return!i.sch.time||nowM()>=tmin(i.sch.time)?'due':'scheduled'}
const occ=k=>IT().filter(i=>sOn(i,k)).map(i=>({i,k,st:lc(i,k),t:i.sch.time||''})).sort((a,b)=>(a.t||'99')<(b.t||'99')?-1:(a.t||'99')>(b.t||'99')?1:0);
const LCC={planned:'var(--mute)',scheduled:'var(--acc)',due:'var(--warn)',completed:'var(--acc2)',skipped:'var(--mute)',missed:'var(--bad)'};
const chipL=s=>`<span class="chip" style="color:${LCC[s]}">${s[0].toUpperCase()+s.slice(1)}</span>`;
const schTxt=i=>{const s=i.sch;if(!s||!s.days.length)return'Planned';return(s.days.length===7?'Daily':s.days.map(d=>DN[d]).join(' '))+(s.time?' · '+s.time:'')+(s.dur?' · '+s.dur+' min':'')};
const exs=i=>lines(i.ex).map(l=>{const p=l.split(',').map(x=>x.trim());return{n:p[0],s:Math.max(1,+p[1]||3),r:+p[2]||10,w:+p[3]||0,rest:+p[4]||60}});
const stp=i=>lines(i.steps).map(l=>{const p=l.split('|');return{t:p[0].trim(),m:+p[1]||0}});
const nut=i=>{const r=i.recipe&&IT().find(x=>x.id===i.recipe),g=k=>(i[k]===''||i[k]==null)?((r&&+r[k])||0):+i[k];return{kcal:g('kcal'),pro:g('pro'),carb:g('carb'),fat:g('fat')}};
const nutH=n=>`<div class="row" style="flex-wrap:wrap;gap:8px;margin:8px 0">${[['kcal',n.kcal,''],['Protein',n.pro,' g'],['Carbs',n.carb,' g'],['Fat',n.fat,' g']].map(([l,v,u])=>`<span class="chip">${l} ${v}${u}</span>`).join('')}</div>`;
const fmtCd=ms=>{if(ms<=0)return'now';const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}h ${m}m`:m>=10?`${m} min`:`${m}:${pad2(s%60)}`};
const note=m=>{const t=document.createElement('div');t.className='toast';t.style.background='var(--acc)';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),4000)};
function alog(i,k,p){const L=AL()[i.id]=AL()[i.id]||{};if(p===null)delete L[k];else L[k]={...(L[k]||{}),...p,at:Date.now()};Store.save(D);render()}
const crow=(on,act,at,n,txt,c,sub)=>`<div class="rw st ${on?'dn':''}"><button class="chk ${on?'COMPLETED':''}" style="--c:${c}" data-act="${act}" ${at} data-v="${n}" aria-label="Toggle">${svg(CK,'',3.4,15)}</button><span class="sp" data-act="${act}" ${at} data-v="${n}">${esc(txt)}${sub?` <span class="mute">· ${sub}</span>`:''}</span></div>`;
const orow=(o,sub)=>{const m=AR[arOf(o.i)];return`<div class="rw pr" data-act="li_run" data-i="${o.i.id}" data-k="${o.k}" style="cursor:pointer"><span class="tm">${o.t||'Anytime'}</span><div class="ic" style="background:${m.c}1f;color:${m.c}">${ico(m.i,20)}</div><div class="sp"><div style="font-weight:600">${esc(o.i.title)}</div><div class="mute" style="font-size:12px">${sub}</div></div>${chipL(o.st)}</div>`};

/* analysis: counts occurrences in a date range */
function agg(from,to,f){
 const r={sch:0,c:0,s:0,m:0,cm:0,pm:0,by:{},wd:Array.from({length:7},()=>({c:0,n:0})),sl:{M:{c:0,n:0},A:{c:0,n:0},E:{c:0,n:0}},days:new Set()};
 for(let k=from;k<=to;k=Engine.addDays(k,1)){const d=Engine.parse(k).getDay();
  for(const o of occ(k)){if(f&&!f(o.i))continue;const du=o.i.sch.dur||0,b=r.by[o.i.id]=r.by[o.i.id]||{c:0,m:0};r.sch++;r.pm+=du;
   if(o.st==='completed'){r.c++;r.cm+=du;r.days.add(k)}else if(o.st==='skipped')r.s++;else if(o.st==='missed'){r.m++;b.m++}
   if(o.st==='completed'||o.st==='skipped'||o.st==='missed'){r.wd[d].n++;if(o.st==='completed')r.wd[d].c++;
    if(o.t){const sl=o.t<'12:00'?'M':o.t<'17:00'?'A':'E';r.sl[sl].n++;if(o.st==='completed')r.sl[sl].c++}}}}
 return r}
const gSets=(from,to)=>{let n=0;IT().filter(i=>i.area==='gym').forEach(i=>{for(const[k,v]of Object.entries(AL()[i.id]||{}))if(k>=from&&k<=to&&v.s==='done')n+=Object.values(v.sets||{}).reduce((a,b)=>a+b,0)});return n};

function vAreas(){
 const t=todayK(),O=occ(t),C=2*Math.PI*24;

${rw('sun',COL[2],'Start',`<input type="time" id="xh-s" value="${hm(t.start??540)}">`,`id="xh-tr" ${flex?'hidden':''}`)}${rw('sunset',COL[5],'End',`<input type="time" id="xh-e" value="${hm((t.start??540)+t.dur)}">`,`id="xh-te" ${flex?'hidden':''}`)}
${rw('timer',COL[4],'Duration (min)',`<input type="number" inputmode="numeric" id="xh-d" min="1" max="720" value="${t.dur}" style="width:90px">`)}</div>
<div class="xg-seg" id="xh-rep">${['daily','weekly','custom'].map(r=>`<button data-act="xg_rep" data-xv="${r}" class="${t.rep===r?'on':''}">${r[0].toUpperCase()+r.slice(1)}</button>`).join('')}</div>
<div class="xg-chips" id="xh-days" ${t.rep==='daily'?'hidden':''}>${[0,1,2,3,4,5,6].map(i=>`<button data-act="xg_day" data-xv="${i}" class="${t.days.includes(i)?'on':''}">${WD[i]}</button>`).join('')}</div>
<div class="xg-g">${rw('bell',COL[3],'Reminder',`<select id="xh-r">${REM.map(([v,l])=>`<option value="${v}" ${String(t.rem)===String(v)?'selected':''}>${l}</option>`).join('')}</select>`)}${rw('flame',COL[7],'Track streak',`<label class="xg-sw"><input type="checkbox" id="xh-t" ${t.track?'checked':''}><i></i></label>`)}</div>
<div class="xg-g"><textarea id="xh-note" rows="3" maxlength="300" placeholder="Notes (optional)">${esc(t.notes)}</textarea></div>${h?`<div class="xg-g"><button class="xg-del" data-act="xg_delh">Delete habit</button></div>`:''}`)}
function areaSheet(id){const a=id&&D.areas.find(x=>x.id===id),t=a||{name:'',icon:'bulb',desc:'',color:COL[4]};S={area:id||1,icon:t.icon,color:t.color};
sheet(`<div class="xg-top"><button data-act="xg_close">Cancel</button><b>${a?'Edit area':'New area'}</b><button data-act="xg_savea">${a?'Save':'Add'}</button></div>
<div class="xg-g"><div class="xg-w"><input class="l" id="xa-n" value="${esc(t.name)}" maxlength="24" placeholder="Name e.g. Reading, Work, Sleep" style="font-size:18px;font-weight:600"></div><div class="xg-w"><input class="l" id="xa-d" value="${esc(t.desc)}" maxlength="80" placeholder="Description"></div></div>
<div class="xg-g"><div class="xg-pk" id="xa-i">${PICK.map(i=>`<button data-act="xg_pick" data-xv="${i}" class="${i===t.icon?'on':''}" aria-label="${i}">${ic(i,22)}</button>`).join('')}</div></div>
<div class="xg-g"><div class="xg-pk cl" id="xa-c">${COL.map(c=>`<button data-act="xg_pcol" data-xv="${c}" class="${c===t.color?'on':''}" style="background:${c}" aria-label="Colour"></button>`).join('')}</div></div>
${a?`<div class="xg-g"><button class="xg-del" data-act="xg_dela" data-xa="${id}">Delete area</button></div>`:`<div class="xg-m xg-sm" style="margin:0 4px 6px">Habits — one per line (optional)</div><div class="xg-g"><textarea id="xa-h" rows="4" placeholder="Read 20 pages&#10;Review notes"></textarea>${rw('sun',COL[2],'Default start','<input type="time" id="xa-s" value="09:00">')}${rw('timer',COL[4],'Default duration (min)','<input type="number" inputmode="numeric" id="xa-u" value="30" min="5" style="width:80px">')}</div><div class="xg-m xg-sm" style="margin:0 4px">Habits are stacked one after another from the start time.</div>`}`)}
document.addEventListener('input',e=>{const i=e.target.id;if(!S||!S.hasOwnProperty('aid')||!i)return;const st=$('#xh-s'),en=$('#xh-e'),du=$('#xh-d');
 if(i==='xh-s'||i==='xh-e'){if(!st.value||!en.value)return;let d=tm(en.value)-tm(st.value);if(d<=0)d+=1440;du.value=d}
 else if(i==='xh-d'&&st.value&&+du.value>0)en.value=hm(tm(st.value)+ +du.value);
 else if(i==='xh-f'){$('#xh-tr').hidden=$('#xh-te').hidden=e.target.checked}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-act^="xg_"]');if(!el)return;ensure();const d=el.dataset,a=D.areas.find(x=>x.id===d.xa),h=a&&d.xh?a.habits.find(x=>x.id===d.xh):null,on=(sel,el)=>document.querySelectorAll(sel).forEach(b=>b.classList.toggle('on',b===el));
 switch(d.act){
 case'xg_open':{open=d.xa;refresh();const el=$('#xg-det');el.classList.add('in');setTimeout(()=>el.classList.remove('in'),480);break}
 case'xg_back':out($('#xg-det'),()=>{open=null;refresh()});break;case'xg_close':closeS();break;
 case'xg_flt':flt=d.xv;try{render()}catch(e){}break;
 case'xg_tog':case'xg_ttog':if(h){const k=dk(new Date());if(h.done[k]){delete h.done[k]}else{h.done[k]=1;popId=popT=h.id}save();refresh()}break;
 case'xg_addh':habitSheet(d.xa);break;case'xg_edith':habitSheet(d.xa,d.xh);break;case'xg_newarea':areaSheet();break;case'xg_edita':areaSheet(d.xa);break;
 case'xg_addat':{const r=el.getBoundingClientRect(),x=e.clientX-r.left,sg=(d.sg||'').split('|').filter(Boolean).map(z=>z.split(',').map(Number));let m=540;if(sg.length){m=sg[0][0];for(const[s0,e0,hw,x0]of sg){const w=(e0-s0)/60*hw;if(x>=x0&&x<=x0+w){m=s0+(x-x0)/hw*60;break}if(x>x0+w)m=e0}}m=Math.max(0,Math.min(1425,Math.round(m/15)*15));habitSheet(open||(flt!=='all'?flt:null),null,{start:m,rep:'custom',days:[+d.xd]});break}
 case'xg_addcell':habitSheet(flt!=='all'?flt:null,null,{start:d.xp==='0'?420:1050,rep:'custom',days:[+d.xd]});break;
 case'xg_rep':on('#xh-rep button',el);$('#xh-days').hidden=d.xv==='daily';break;case'xg_day':el.classList.toggle('on');break;
 case'xg_pick':S.icon=d.xv;on('#xa-i button',el);break;case'xg_pcol':S.color=d.xv;on('#xa-c button',el);break;
 case'xg_saveh':{const n=$('#xh-n').value.trim(),fx=$('#xh-f').checked,du=Math.round(+$('#xh-d').value),rep=$('#xh-rep .on').dataset.xv,days=[...document.querySelectorAll('#xh-days .on')].map(b=>+b.dataset.xv);
  if(!n)return toast('Give the habit a name');if(!(du>0))return toast('Duration must be at least 1 minute');if(rep!=='daily'&&!days.length)return toast('Pick at least one day');if(!fx&&!$('#xh-s').value)return toast('Set a start time');
  const sel=$('#xh-a'),A=D.areas.find(x=>x.id===(sel?sel.value:S.aid)),st=fx?null:tm($('#xh-s').value),rv=$('#xh-r').value,v={name:n,start:st,end:fx?null:st+du,dur:du,rep,days:rep==='daily'?[0,1,2,3,4,5,6]:days,rem:fx||rv===''?'':+rv,notes:$('#xh-note').value.trim(),track:$('#xh-t').checked};
  if(S.hid)Object.assign(A.habits.find(x=>x.id===S.hid),v);else A.habits.push({id:uid(),done:{},...v});
  if(v.rem!==''&&window.Notification&&Notification.permission==='default')Notification.requestPermission();save();closeS();refresh();break}
 case'xg_delh':if(confirm('Delete this habit?')){const A=D.areas.find(x=>x.id===S.aid);A.habits=A.habits.filter(x=>x.id!==S.hid);save();closeS();refresh()}break;
 case'xg_savea':{const n=$('#xa-n').value.trim();if(!n)return toast('Give the area a name');const v={name:n,icon:S.icon,color:S.color,desc:$('#xa-d').value.trim()};
  if(S.area!==1)Object.assign(D.areas.find(x=>x.id===S.area),v);else{const A={id:'a'+uid(),...v,habits:[]};let s=tm($('#xa-s').value||'09:00'),du=Math.max(5,+$('#xa-u').value||30);
   $('#xa-h').value.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,20).forEach(x=>{A.habits.push({id:uid(),name:x.slice(0,40),start:s%1440,end:s%1440+du,dur:du,rep:'daily',days:[0,1,2,3,4,5,6],rem:10,notes:'',track:true,done:{}});s+=du+10});D.areas.push(A);open=A.id}
  save();closeS();refresh();break}
 case'xg_dela':if(confirm('Delete this area and all its habits?')){D.areas=D.areas.filter(x=>x.id!==d.xa);if(flt===d.xa)flt='all';open=null;save();closeS();refresh()}break}});
function note(t,b){toast('Reminder: '+t);try{if(Notification.permission==='granted')new Notification(b,{body:t})}catch(e){}}
setInterval(()=>{const n=nowM(),k=dk(new Date());D.areas.forEach(a=>a.habits.forEach(h=>{const id=h.id+k;if(h.start==null||h.rem===''||h.done[k]||F[id]||!sch(h,new Date()))return;if(n===h.start-h.rem){F[id]=1;note(h.name+' · '+f12(h.start),a.name)}}))},15000);
/* ---- Today tab: planned habits join the to-do list, ordered by time ---- */
const todayList=()=>{const t=new Date();return D.areas.flatMap(a=>a.habits.filter(h=>sch(h,t)).map(h=>({a,h})))};
window.xgToday=todayList;
window.xgCount=()=>{const k=dk(new Date()),l=todayList();return{n:l.length,d:l.filter(x=>x.h.done[k]).length}};
window.xgMerge=arr=>{const k=dk(new Date()),n=nowM(),mine=todayList().map(({a,h},i)=>{const dn=!!h.done[k],ms=!dn&&h.start!=null&&h.end<=n,rn=!dn&&h.start!=null&&h.start<=n&&n<h.end,fr=popT===h.id;
  const st=dn?'Done \u00b7 ':ms?'<span style="color:var(--bad)">Missed</span> \u00b7 ':rn?'<span style="color:'+a.color+'">Now</span> \u00b7 ':'';
  return{k:h.start==null?'99:99':hm(h.start),i:1000+i,html:`<div class="item"><div class="ic" style="background:${a.color}1f;color:${a.color}">${ic(a.icon,22)}</div><div class="sp" data-act="xg_edith" data-xa="${a.id}" data-xh="${h.id}" style="cursor:pointer"><div>${esc(h.name)}</div><div class="mute">${st}${h.start==null?'Anytime':f12(h.start)+' \u2013 '+f12(h.end)} \u00b7 ${fd(h.dur)} \u00b7 ${esc(a.name)}</div></div><button class="chk ${dn?'COMPLETED':''} ${dn&&fr?'fresh':''}" style="--c:${a.color}" data-act="xg_ttog" data-xa="${a.id}" data-xh="${h.id}" aria-label="${dn?'Mark not done':'Complete'} ${esc(h.name)}">${dn?ic('check',20,3.4):''}</button></div>`}});
 popT=null;return[...arr.map((o,i)=>({...o,i})),...mine].sort((x,y)=>x.k<y.k?-1:x.k>y.k?1:x.i-y.i).map(o=>o.html).join('')};
document.addEventListener('scroll',e=>{if(e.target.classList&&e.target.classList.contains('xg-sc')&&e.target.closest('#app'))SL=e.target.scrollLeft},true);
ensure();save();
})();
</script></body></html>
