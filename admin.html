<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a0c12">
<title>HabitFlow Admin</title>
<style>
:root{--bg:#0a0c12;--panel:#12151e;--panel2:#171b27;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);--txt:#eef1f7;--mut:#8b94a8;--acc:#7c9cff;--ok:#4ade80;--warn:#fbbf24;--bad:#ff8a8a;--r:14px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:rgba(10,12,18,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#7c9cff,#a78bfa);display:grid;place-items:center;font-weight:800;color:#0a0c12}
.brand h1{margin:0;font-size:17px;line-height:1.1}
.brand small{color:var(--mut);font-size:12px}
.btn{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:8px 13px;font-size:14px}
.btn:hover{border-color:var(--acc)}
.btn.p{background:var(--acc);color:#0a0c12;border-color:var(--acc);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{display:block;font-size:28px;line-height:1.1;letter-spacing:-.02em}
.stat span{color:var(--mut);font-size:13px}
.stat.hero{background:linear-gradient(135deg,rgba(124,156,255,.18),rgba(167,139,250,.12));border-color:rgba(124,156,255,.35)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1;min-width:220px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:10px 13px;outline:none}
.search:focus{border-color:var(--acc)}
select{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:10px 12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:transparent;border:1px solid var(--line2);border-radius:99px;padding:6px 13px;font-size:13px;color:var(--mut)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#0a0c12;font-weight:600}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:44px minmax(0,1.5fr) minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;transition:border-color .15s,transform .15s}
.row:hover{border-color:var(--acc);transform:translateY(-1px)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px;color:#0a0c12}
.who b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{display:block;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.counts{display:flex;gap:6px;flex-wrap:wrap}
.cn{background:var(--panel2);border-radius:8px;padding:3px 9px;font-size:12px;color:var(--mut)}
.cn b{color:var(--txt);font-weight:600;margin-right:3px}
.meta{text-align:right;font-size:13px;color:var(--mut)}
.meta .pill{margin-bottom:4px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(255,255,255,.08);color:var(--mut)}
.pill.ok{background:rgba(74,222,128,.14);color:var(--ok)}
.pill.warn{background:rgba(251,191,36,.14);color:var(--warn)}
.pill.acc{background:rgba(124,156,255,.16);color:var(--acc)}
.empty,.msg{padding:48px 16px;text-align:center;color:var(--mut)}
.err{color:var(--bad)}
.foot{color:var(--mut);font-size:13px;margin:12px 2px}
@media(max-width:720px){
 .row{grid-template-columns:44px 1fr;gap:10px 12px}
 .row .counts,.row .meta{grid-column:1/-1;text-align:left}
}
/* drawer */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;justify-content:flex-end}
.dr{width:min(780px,100%);height:100%;background:var(--bg);border-left:1px solid var(--line2);display:flex;flex-direction:column;animation:in .18s ease-out}
@keyframes in{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.dh{display:flex;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line)}
.dh .who{flex:1;min-width:0}
.dh .who b{font-size:18px}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 14px 0;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;color:var(--mut);font-size:14px;white-space:nowrap;border-radius:0}
.tab.on{color:var(--txt);border-color:var(--acc);font-weight:600}
.tab i{font-style:normal;background:var(--panel2);border-radius:99px;padding:1px 7px;font-size:11px;margin-left:5px}
.db{flex:1;overflow-y:auto;padding:16px 18px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.kv{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.kv span{display:block;color:var(--mut);font-size:12px;margin-bottom:2px}
.kv b{font-size:14px;font-weight:600;word-break:break-word}
.h{margin:20px 0 8px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.h:first-child{margin-top:0}
.ent{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.eh{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.eh b{font-size:15px}
.dot{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid var(--line2)}
.ic{font-size:18px;line-height:1}
.kvs{display:flex;flex-wrap:wrap;gap:6px}
.kvs .cn b{font-weight:500;color:var(--mut)}
.kvs .cn{color:var(--txt)}
.sub{margin:8px 0 0;padding-left:18px;color:var(--txt);font-size:14px}
.day{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.day h4{margin:0 0 6px;font-size:14px}
.day div{font-size:13px;color:var(--mut)}
.day div b{color:var(--txt);font-weight:500}
pre{background:#06080d;border:1px solid var(--line);border-radius:12px;padding:14px;overflow:auto;font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-word;margin:0}
.note{color:var(--mut);font-size:13px;margin-top:6px}
</style>
</head>
<body>
<div class="top"><div class="top-in">
  <div class="brand"><div class="logo">H</div><div><h1>HabitFlow Admin</h1><small id="who">Checking access…</small></div></div>
  <button class="btn" id="ref">Refresh</button>
  <button class="btn" id="csv">Export CSV</button>
  <button class="btn p" id="back">Open app</button>
</div></div>
<main id="main"><div class="msg">Loading…</div></main>
<script>
(function(){
var API='https://imtmooehxqhaikwdxiiy.supabase.co',KEY='sb_publishable__z44t4ZscZeIcJ3H-qmFjg_ZdN4dqoN',SK='habitflow.session';
var rows=[],q='',filter='all',sort='new';

}

/* ---------- formatting ---------- */
function fmt(d){if(!d)return '—';var x=new Date(d);return isNaN(x)?'—':x.toLocaleString([],{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}

function msg(t,c){var m=$('#main');m.innerHTML='';m.appendChild(el('div','msg '+(c||''),t))}

async function load(){
  msg('Loading…');
  try{
    var r=await rpc('admin_list_users');

/* ---------- user drawer ---------- */

function entList(p,a,empty){if(!a.length){p.appendChild(el('div','empty',empty));return}a.forEach(function(o){p.appendChild(ent(o))})}

     if(p.settings&&typeof p.settings==='object'&&Object.keys(p.settings).length){p2.appendChild(h('Settings'));var g3=el('div','grid');Object.keys(p.settings).forEach(function(k){var v=p.settings[k];g3.appendChild(kv(k,k==='avatar'&&typeof v==='string'&&v.length>40?'(image)':val(v)))});p2.appendChild(g3)}
     p2.appendChild(h('Push devices'));
     if((d.push||[]).length){var g4=el('div','grid');d.push.forEach(function(s,i){g4.appendChild(kv('Device '+(i+1),(s.tz||'UTC')+' · added '+fmt(s.created_at)))});p2.appendChild(g4)}else p2.appendChild(el('div','note','No push devices.'));
   }],
   ['Habits',habits.length,function(p2){entList(p2,habits,'No habits yet.')}],
   ['Goals',goals.length,function(p2){entList(p2,goals,'No goals yet.')}],
   ['Routines',routines.length,function(p2){entList(p2,routines,'No routines yet.')}],
   ['Planner',items.length,function(p2){entList(p2,items,'No planner items yet.')}],
   ['Areas',areas.length,function(p2){entList(p2,areas,'No areas yet.')}],
   ['Activity',Object.keys(p.logs||{}).length+Object.keys(p.rlogs||{}).length,function(p2){
     p2.appendChild(h('Habit logs'));logs(p2,p.logs,hn,'No habit logs yet.');
     p2.appendChild(h('Routine logs'));logs(p2,p.rlogs,rn,'No routine logs yet.');
   }],
   ['Raw data',null,function(p2){var pre=el('pre',null,JSON.stringify({planner:p,areas:ar},null,2));p2.appendChild(pre)}]
  ];
  function show(i){
    Array.prototype.forEach.call(tabs.children,function(b,j){b.className='tab'+(i===j?' on':'')});
    db.innerHTML='';T[i][2](db);db.scrollTop=0;
  }
  T.forEach(function(t,i){var b=el('button','tab',t[0]);if(t[1]!=null)b.appendChild(el('i',null,t[1]));b.onclick=function(){show(i)};tabs.appendChild(b)});
  show(0);
}
/* ---------- export ---------- */
function csv(){
  var hd=['name','email','provider','created_at','last_sign_in_at','has_data','habits','goals','routines','items','areas','log_days','push_devices'];
  function e(v){v=v==null?'':String(v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}
  var out=[hd.join(',')].concat(rows.map(function(u){return hd.map(function(k){return e(u[k])}).join(',')})).join('\n');
  var a=document.createElement('a');a.href=window.URL.createObjectURL(new Blob([out],{type:'text/csv'}));a.download='habitflow-users.csv';a.click();
}
$('#ref').onclick=load;$('#csv').onclick=function(){if(rows.length)csv()};$('#back').onclick=function(){location.href='/app'};
load();
})();
