<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>HabitFlow Admin</title>
<style>
:root{--bg:#f7f7fa;--surf:#fff;--text:#0d0e14;--mute:#6c7080;--line:#ebebf1;--acc:#5b5bf0;--acc2:#14c8a8;--warn:#f5a623;--bad:#ef4565;--rest:#efeff5;--sh:0 1px 2px rgba(20,20,40,.04),0 8px 24px rgba(20,20,40,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#09090e;--surf:#14141c;--text:#f5f5fa;--mute:#8a8ea0;--line:#23232f;--acc:#8c8cff;--rest:#1d1d28;--sh:0 0 0 transparent}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 "Inter",-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
main{max-width:640px;margin:0 auto;padding:22px 18px 60px}
h1{font-size:34px;font-weight:800;margin:2px 0;letter-spacing:-1px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);margin:28px 0 12px;font-weight:700}
.mute{color:var(--mute);font-size:14px}
.row{display:flex;align-items:center;gap:12px}
.sp{flex:1;min-width:0}
.card{background:var(--surf);border-radius:24px;padding:4px 16px;box-shadow:var(--sh);border:1px solid var(--line)}
.item{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);min-height:72px}
.item:last-child{border-bottom:0}
.item .sp>div:first-child{font-weight:600}
.item .sp>div{overflow-wrap:anywhere}
.ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:22px;flex:none;font-weight:700}
.btn{border:0;border-radius:16px;padding:12px 18px;background:var(--text);color:var(--bg);font-weight:700;min-height:44px}
.btn.g{background:var(--rest);color:var(--text)}
.chip{display:inline-block;padding:4px 11px;border-radius:99px;font-size:12px;font-weight:700;background:var(--rest);color:var(--mute);white-space:nowrap}
.chip.ok{background:color-mix(in srgb,var(--acc2) 16%,transparent);color:var(--acc2)}
.chip.acc{background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc)}
.chip.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:14px 16px;box-shadow:var(--sh)}
.stat b{display:block;font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat span{color:var(--mute);font-size:13px}
.stat.hero{grid-column:1/-1;background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;color:#fff}
.stat.hero span{color:rgba(255,255,255,.85)}
.stat.hero b{font-size:44px}
.search{width:100%;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:13px 16px;outline:none;box-shadow:var(--sh)}
.search:focus{border-color:var(--acc)}
.tools{display:flex;gap:10px;margin:22px 0 12px}
select{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:0 12px;box-shadow:var(--sh)}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:var(--rest);color:var(--mute);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:600;white-space:nowrap}
.seg button.on{background:var(--text);color:var(--bg)}
.go{color:var(--mute);font-size:22px;margin-left:2px}
.empty{padding:28px 8px;text-align:center;color:var(--mute);font-size:14px}
.msg{padding:60px 16px;text-align:center;color:var(--mute)}
.err{color:var(--bad)}
.foot{text-align:center;margin-top:18px}
/* detail page */
.page{position:fixed;inset:0;background:var(--bg);z-index:30;overflow-y:auto;animation:in .2s ease-out;padding-top:env(safe-area-inset-top,0px)}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.back{border:0;background:var(--rest);color:var(--text);border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px;margin-bottom:14px}
.hero-u{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.hero-u .ic{width:64px;height:64px;border-radius:22px;font-size:26px}
.hero-u h1{font-size:28px;overflow-wrap:anywhere}
.kv{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--mute);flex:none}
.kv b{font-weight:600;text-align:right;overflow-wrap:anywhere}
.dock{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:460px;margin:0 auto;display:flex;padding:6px;border-radius:999px;background:color-mix(in srgb,var(--surf) 72%,transparent);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid color-mix(in srgb,var(--text) 8%,transparent);box-shadow:0 10px 36px rgba(20,20,50,.18);z-index:40}
.dock button{flex:1;border:0;background:none;border-radius:999px;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--mute);position:relative}
.dock button.on{color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.dock svg{width:21px;height:21px}
.dock .n{position:absolute;top:5px;right:calc(50% - 22px);background:var(--acc);color:#fff;border-radius:99px;font-size:10px;line-height:1;padding:3px 5px;font-weight:700}
.pad{height:110px}
.sub{font-size:13px;color:var(--mute);margin-top:2px}
.tasks{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.tasks div{font-size:14px;display:flex;gap:8px;align-items:flex-start}
.tasks i{font-style:normal;color:var(--mute);flex:none;width:16px}
.tasks .d{color:var(--mute);text-decoration:line-through}
.tasks .d i{color:var(--acc2)}
.col{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.bar{height:8px;border-radius:9px;background:var(--rest);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:9px}
</style>
</head>

     s2.appendChild(kvRow('Daily goal',set.goal!=null?set.goal+'%':'—'));
     s2.appendChild(kvRow('Notifications',set.notify?'On':'Off'));
     s2.appendChild(kvRow('Quiet hours',quiet.length===2?quiet[0]+' – '+quiet[1]:'—'));
     c.appendChild(s2);
     c.appendChild(h2('Push devices'));
     if((d.push||[]).length){var pc=el('div','card');d.push.forEach(function(x,i){pc.appendChild(kvRow('Device '+(i+1),(x.tz||'UTC').replace(/_/g,' ')+' · added '+fmtShort(x.created_at)))});c.appendChild(pc)}else c.appendChild(emptyCard('No devices registered for notifications.'));
   }],
   ['Habits',SVG.habit,habits.length,function(c){
     if(!habits.length){c.appendChild(emptyCard('No habits yet.'));return}
     var card=el('div','card');
     habits.forEach(function(h){
       var st=hstats(h),it=el('div','item');it.appendChild(tile(icon(h.icon),h.color));
       var sp=el('div','sp');sp.appendChild(el('div',null,h.name||'(untitled)'));
       var line=[daysText(h.days),targetText(h)];if(h.reminder)line.push('Reminder '+h.reminder);if(h.category)line.push(h.category);
       sp.appendChild(el('div','sub',line.join(' · ')));
       if(h.description)sp.appendChild(el('div','sub',h.description));
       sp.appendChild(el('div','sub',st.days?'Logged '+pl(st.days,'day')+' · completed '+st.done+' · last '+fmtShort(st.last):'Not logged yet'));
       it.appendChild(sp);
       it.appendChild(el('span','chip '+(h.status==='archived'?'':'ok'),h.status==='archived'?'Archived':'Active'));card.appendChild(it);
     });
     c.appendChild(card);
   }],
   ['Goals',SVG.goal,goals.length,function(c){
     if(!goals.length){c.appendChild(emptyCard('No goals yet.'));return}
     var card=el('div','card');
     goals.forEach(function(gl){
       var it=el('div','item');it.appendChild(tile(icon(gl.icon),gl.color));
       var sp=el('div','sp');sp.appendChild(el('div',null,gl.title||'(untitled)'));
       var line=[];if(gl.target!=null&&gl.target!=='')line.push('Target '+gl.target);var hb=hmap[String(gl.habit)];if(hb)line.push('Habit: '+hb.name);if(gl.start)line.push('Started '+fmtShort(gl.start));
       if(line.length)sp.appendChild(el('div','sub',line.join(' · ')));
       if(gl.due){var dd=dateOf(gl.due),days=dd?Math.ceil((dd-new Date().setHours(0,0,0,0))/864e5):null;sp.appendChild(el('div','sub','Due '+fmtShort(gl.due)+(days==null||gl.done?'':days<0?' · overdue by '+pl(-days,'day'):days===0?' · due today':' · in '+pl(days,'day'))))}
       it.appendChild(sp);it.appendChild(el('span','chip '+(gl.done?'ok':'acc'),gl.done?'Done':'In progress'));card.appendChild(it);
     });
     c.appendChild(card);
   }],
   ['Routines',SVG.routine,routines.length,function(c){
     if(!routines.length){c.appendChild(emptyCard('No routines yet.'));return}
     var card=el('div','card');
     routines.forEach(function(r){
       var it=el('div','item');it.style.alignItems='flex-start';it.style.paddingTop='16px';it.style.paddingBottom='16px';it.appendChild(tile(icon(r.icon),r.color));
       var sp=el('div','sp');sp.appendChild(el('div',null,r.name||'(untitled)'));
       var line=[daysText(r.days)];if(r.time)line.push('at '+r.time);if(r.remind)line.push('Reminder on');
       sp.appendChild(el('div','sub',line.join(' · ')));
       var steps=arr(r.steps);
       if(steps.length){var tk=el('div','tasks');steps.forEach(function(s,i){var row=el('div');row.appendChild(el('i',null,String(i+1)+'.'));row.appendChild(el('span',null,(s&&(s.t||s.name||s.title))||'(empty step)'));tk.appendChild(row)});sp.appendChild(tk)}
       var rl=obj(rlogs[r.id]),rd=Object.keys(rl).length;
       sp.appendChild(el('div','sub',rd?'Worked on '+pl(rd,'day')+' · last '+fmtShort(Object.keys(rl).sort().pop()):'Not started yet'));
       it.appendChild(sp);it.appendChild(el('span','chip '+(r.status==='archived'?'':'ok'),r.status==='archived'?'Archived':'Active'));card.appendChild(it);
     });
     c.appendChild(card);
   }],
   ['Planner',SVG.plan,items.length+areas.length,function(c){
     if(!items.length){c.appendChild(emptyCard('No planner items yet.'))}
     var groups={};items.forEach(function(i){var k=i.area==='recipes'?'cook':(i.area||'other');(groups[k]=groups[k]||[]).push(i)});
     Object.keys(groups).forEach(function(k){
       c.appendChild(h2((AREA[k]||'Other')+' · '+groups[k].length));var card=el('div','card');
       groups[k].forEach(function(i){
         var it=el('div','item');it.style.alignItems='flex-start';it.style.paddingTop='14px';it.style.paddingBottom='14px';
         var sp=el('div','sp');sp.appendChild(el('div',null,i.title||'(untitled)'));
         var line=[];if(i.subject)line.push(i.subject);if(i.pri)line.push(i.pri+' priority');
         if(i.sch&&arr(i.sch.days).length){line.push(daysText(i.sch.days)+(i.sch.time?' at '+i.sch.time:i.sch.at?' at '+i.sch.at:''))}else line.push('Not scheduled');
         sp.appendChild(el('div','sub',line.join(' · ')));
         var tasks=String(i.tasks||'').split('\n').map(function(x){return x.trim()}).filter(Boolean);
         if(tasks.length){var td=obj(i.td),n=tasks.filter(function(x){return td[x]}).length;sp.appendChild(el('div','sub',n+' of '+pl(tasks.length,'task')+' done'));
           var tk=el('div','tasks');tasks.forEach(function(x){var row=el('div',td[x]?'d':'');row.appendChild(el('i',null,td[x]?'✓':'○'));row.appendChild(el('span',null,x));tk.appendChild(row)});sp.appendChild(tk)}
         it.appendChild(sp);card.appendChild(it);
       });
       c.appendChild(card);
     });
     if(areas.length){
       c.appendChild(h2('Areas · '+areas.length));var ac=el('div','card');
       areas.forEach(function(x){
         var it=el('div','item');it.appendChild(tile(icon(x.icon),x.color));
         var sp=el('div','sp');sp.appendChild(el('div',null,x.name||'(untitled)'));if(x.desc)sp.appendChild(el('div','sub',x.desc));
         var hn=arr(x.habits).map(function(id){var h=hmap[String(id)];return h?h.name:null}).filter(Boolean);
         if(hn.length)sp.appendChild(el('div','sub','Habits: '+hn.join(', ')));
         it.appendChild(sp);ac.appendChild(it);
       });
       c.appendChild(ac);
     }
   }],
   ['Activity',SVG.act,Object.keys(dayset).length,function(c){
     var keys=Object.keys(dayset).sort().reverse();
     if(!keys.length){c.appendChild(emptyCard('No activity logged yet.'));return}
     var today=new Date();today.setHours(0,0,0,0);
     keys.slice(0,30).forEach(function(k){
       var dd=parseKey(k),diff=Math.round((today-dd)/864e5);
       c.appendChild(h2(diff===0?'Today':diff===1?'Yesterday':fmtDay(k)));var card=el('div','card'),n=0;
       habits.forEach(function(h){
         var l=obj(logs[h.id])[k];var s=hstate(h,l);if(!l)return;n++;
         var it=el('div','item');it.style.minHeight='64px';it.appendChild(tile(icon(h.icon),h.color));
         var sp=el('div','sp');sp.appendChild(el('div',null,h.name||'(untitled)'));
         var line=[];if(h.type!=='yesno'&&!l.skip){var u2=unitOf(h);line.push((l.v||0)+' of '+(h.target||'—')+(u2?' '+u2:''))}
         if(l.note)line.push('“'+l.note+'”');if(line.length)sp.appendChild(el('div','sub',line.join(' · ')));
         it.appendChild(sp);it.appendChild(el('span','chip '+(s==='Completed'?'ok':s==='Partial'?'warn':''),s||'Logged'));card.appendChild(it);
       });
       routines.forEach(function(r){
         var done=arr(obj(rlogs[r.id])[k]);if(!done.length)return;n++;
         var tot=arr(r.steps).length,it=el('div','item');it.style.minHeight='64px';it.appendChild(tile(icon(r.icon),r.color));
         var sp=el('div','sp');sp.appendChild(el('div',null,r.name||'(untitled)'));sp.appendChild(el('div','sub','Routine · '+done.length+' of '+pl(tot,'step')+' done'));
         if(tot){var b=el('div','bar'),f=el('i');f.style.width=Math.min(100,Math.round(done.length/tot*100))+'%';b.appendChild(f);sp.appendChild(b)}
         it.appendChild(sp);it.appendChild(el('span','chip '+(tot&&done.length>=tot?'ok':'warn'),tot&&done.length>=tot?'Completed':'Partial'));card.appendChild(it);
       });
       if(n)c.appendChild(card);else{c.lastChild.remove()}
     });
     if(keys.length>30)c.appendChild(el('div','empty','Showing the latest 30 of '+pl(keys.length,'day')+'.'));
   }]
  ];
  var dock=el('div','dock'),pad=el('div','pad');
  function show(i){
    Array.prototype.forEach.call(dock.children,function(b,j){b.className=i===j?'on':''});
    content.innerHTML='';T[i][3](content);pageEl.scrollTop=0;
  }
  T.forEach(function(t,i){var b=el('button');b.appendChild(svgEl(t[1]));b.appendChild(el('span',null,t[0]));if(t[2])b.appendChild(el('span','n',t[2]));b.onclick=function(){show(i)};dock.appendChild(b)});
  main.appendChild(pad);pageEl.appendChild(dock);show(0);
}
/* ---------- export ---------- */
function csv(){
  var hd=['name','email','sign_in_method','joined','last_sign_in','habits','goals','routines','planner_items','areas','days_logged','push_devices'];
  var keys=['name','email','provider','created_at','last_sign_in_at','habits','goals','routines','items','areas','log_days','push_devices'];
  function e(v){v=v==null?'':String(v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}
  var out=[hd.join(',')].concat(rows.map(function(u){return keys.map(function(k){return e(u[k])}).join(',')})).join('\n');
  var a=document.createElement('a');a.href=window.URL.createObjectURL(new Blob([out],{type:'text/csv'}));a.download='habitflow-users.csv';a.click();
}
load();
})();
